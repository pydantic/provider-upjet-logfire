        argumentDocs:
            alert_id: (String) ID of the tier's alert. Null only for an SLO created before Logfire kept all three tier alerts, when the tier could not fire at the SLO's target. The provider then plans an update of the SLO, even when no attribute changed, and that update creates the missing alert.
            alerts: '(Attributes) The SLO''s burn-rate alerts, one per tier: fast and medium (severity page) and slow (severity ticket). Each alert exists as long as the SLO does. Configure channel_assignments on the tiers whose delivery Terraform should manage. A tier that is not configured is not sent and not managed: the provider reports its current channels and never changes them. Setting channel_assignments needs Logfire v2026-09-23.01 or newer. An older release does not apply them, so the provider fails the apply with an error. alerts is null when the Logfire release does not return the SLO''s alerts. (see below for nested schema)'
            bad_query: (String) SQL boolean expression selecting the bad events counted by the SLO. Required for every mode except metric_aggregation = "histogram_threshold", which uses threshold and comparison instead.
            channel_assignments: (Attributes Set) Channels of this tier's alert, each with an optional delivery schedule. The provider writes the value to the alert on create, and on update when it differs from what the alert has. It is read back from the alert, so a change made on the Logfire alerts page shows as drift. Set it to [] to remove every channel. It is the same type as logfire_alert.channel_assignments. (see below for nested schema)
            channel_id: (String) ID of the logfire_channel to notify.
            comparison: '(String) For metric_aggregation = "histogram_threshold": the good side of the threshold. less_than (good is below the threshold, the latency case) or greater_than. Required for that mode, and must be omitted otherwise.'
            description: (String) SLO description.
            environments: (Set of String) Deployment environments the SLO is scoped to. Omit to cover all environments.
            fast: (Attributes) The fast burn-rate tier's alert (severity page). Omit it to leave that alert's channels as they are. (see below for nested schema)
            id: (String) SLO ID.
            medium: (Attributes) The medium burn-rate tier's alert (severity page). Omit it to leave that alert's channels as they are. (see below for nested schema)
            metric_aggregation: '(String) How a metrics SLO aggregates its SLI: additive (sum of scalar values, for delta-count metrics), gauge_fraction (fraction of samples meeting the condition, for gauges), counter_rate (sum of per-series increases, for cumulative counters), or histogram_threshold (fraction of histogram observations past a threshold; uses threshold and comparison instead of bad_query, and requires source = "metrics"). Ignored when source = "records". Defaults to additive.'
            name: (String) SLO name (unique per project).
            project_id: (String) Project ID (UUID) used for SLO API paths.
            rolling_window: '(String) Rolling evaluation window as a duration string (e.g. "24h", "30d"). Must be between 1h and 90d. The API enforces a lower effective cap: the window cannot exceed your subscription plan''s maximum SLO window, nor the project''s data retention for the SLO source (records or metrics) — a longer window would compute against missing data. Requests over either cap are rejected with a validation error.'
            schedule_id: (String) ID of a logfire_schedule. The channel is notified only inside the schedule's windows. Omit it to notify the channel at all times.
            scope_kind: '(String) What the SLO is anchored to: a service (service) or an LLM provider (provider). Defaults to service. Changing it forces a new SLO.'
            scope_value: (String) The service name (scope_kind = "service") or provider slug like openai (scope_kind = "provider"). Changing it forces a new SLO.
            severity: (String) page for the fast and medium tiers, ticket for the slow tier.
            slow: (Attributes) The slow burn-rate tier's alert (severity ticket). Omit it to leave that alert's channels as they are. (see below for nested schema)
            source: (String) Whether the SLO ratio is computed over span events (records) or metric values (metrics). Defaults to records.
            target_percent: (String) Target percentage as a decimal string, exclusively between 0 and 100 (e.g. "99.9").
            threshold: '(String) For metric_aggregation = "histogram_threshold": the cutoff in the metric''s native unit, as a decimal string (e.g. "60000" on a _ms latency metric). Required for that mode, and must be omitted otherwise.'
            total_query: (String) SQL boolean expression selecting all events counted by the SLO.
            viable: (Boolean) False when the tier cannot fire at the SLO's target_percent. The alert keeps its channels but is not evaluated until a target change makes the tier viable.
        importStatements:
            - |-
              # Import by project name and SLO name.
              terraform import logfire_slo.example "example-project/payments-availability"
    logfire_write_token:
        subCategory: ""
        description: 'Manages a Logfire write token. Equivalent to logfire_api_key with scopes ["project:write_otlp"]. Creating it requires the project:write_token scope on a credential that can reach the project. Import is not supported: the API returns the token value only at creation, so an imported token could never reproduce its secret in state. Recreate a token with Terraform to adopt it.'
